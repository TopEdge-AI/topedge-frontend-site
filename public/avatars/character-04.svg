<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="c4-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="c4-skin" x1="60" y1="30" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE4C9"/><stop offset="1" stop-color="#F0C4A0"/>
    </linearGradient>
    <linearGradient id="c4-hair" x1="35" y1="0" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="c4-shirt" x1="20" y1="78" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="c4-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#134E4A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#c4-bg)"/>
  <!-- ponytail -->
  <ellipse cx="88" cy="42" rx="14" ry="22" fill="url(#c4-hair)" transform="rotate(25 88 42)"/>
  <path d="M82 28c8-6 18-4 22 6s-2 20-12 22" fill="#D97706" opacity=".5"/>
  <!-- shirt -->
  <path d="M6 118c8-22 28-34 54-34s46 12 54 34H6z" fill="url(#c4-shirt)"/>
  <path d="M44 90h32v6c0 3-10 5-16 5s-16-2-16-5v-6z" fill="#34D399" opacity=".5"/>
  <!-- neck -->
  <ellipse cx="60" cy="84" rx="12" ry="8" fill="#F0C4A0"/>
  <!-- face -->
  <ellipse cx="60" cy="56" rx="33" ry="31" fill="url(#c4-skin)" filter="url(#c4-sh)"/>
  <!-- hair -->
  <path d="M26 54c4-32 18-44 34-44s30 12 34 44c-6-12-18-18-34-18S32 42 26 54z" fill="url(#c4-hair)"/>
  <path d="M30 38c8-10 20-14 30-12s20 8 24 18c-6-8-16-14-30-14S36 30 30 38z" fill="#FFF" opacity=".2"/>
  <!-- bangs -->
  <path d="M34 44c8 8 20 10 28 6 6-2 10-8 8-14-8 6-20 10-36 8z" fill="#FBBF24" opacity=".85"/>
  <!-- brows -->
  <path d="M38 50c6-2 12-2 16 2" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66 52c4-3 12-3 18 1" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="46" cy="58" rx="5" ry="6" fill="#1E293B"/>
  <ellipse cx="74" cy="58" rx="5" ry="6" fill="#1E293B"/>
  <circle cx="47.5" cy="56" r="2" fill="#FFF"/>
  <circle cx="75.5" cy="56" r="2" fill="#FFF"/>
  <!-- freckles -->
  <circle cx="42" cy="66" r="1" fill="#D4956A" opacity=".5"/><circle cx="48" cy="68" r=".8" fill="#D4956A" opacity=".5"/>
  <circle cx="72" cy="66" r="1" fill="#D4956A" opacity=".5"/><circle cx="78" cy="68" r=".8" fill="#D4956A" opacity=".5"/>
  <!-- smile -->
  <path d="M48 70c6 7 18 7 24 0" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M54 69c3 2 9 2 12 0" fill="#FFF" opacity=".2"/>
  <!-- blush -->
  <ellipse cx="36" cy="64" rx="5" ry="3.5" fill="#FB7185" opacity=".22"/>
  <ellipse cx="84" cy="64" rx="5" ry="3.5" fill="#FB7185" opacity=".22"/>
</svg>
