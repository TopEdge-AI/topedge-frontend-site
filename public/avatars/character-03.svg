<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="c3-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="c3-skin" x1="60" y1="32" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDDCBF"/><stop offset="1" stop-color="#E8B896"/>
    </linearGradient>
    <linearGradient id="c3-hair" x1="20" y1="4" x2="100" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292524"/><stop offset="1" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="c3-shirt" x1="20" y1="78" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="c3-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4C1D95" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#c3-bg)"/>
  <!-- hair back -->
  <path d="M18 70c-2-36 16-58 42-58s44 22 42 58c-8-28-24-40-42-40S26 42 18 70z" fill="url(#c3-hair)"/>
  <!-- shirt -->
  <path d="M8 118c6-20 26-32 52-32s46 12 52 32H8z" fill="url(#c3-shirt)"/>
  <path d="M48 86h24c0 6-6 10-12 10s-12-4-12-10z" fill="#EDE9FE" opacity=".35"/>
  <!-- neck -->
  <ellipse cx="60" cy="82" rx="12" ry="8" fill="#E8B896"/>
  <!-- face -->
  <ellipse cx="60" cy="56" rx="34" ry="32" fill="url(#c3-skin)" filter="url(#c3-sh)"/>
  <!-- hair front -->
  <path d="M24 52c2-28 16-40 36-40s34 12 36 40c-6-10-16-16-36-16S30 42 24 52z" fill="url(#c3-hair)"/>
  <path d="M28 36c10-12 24-16 32-14s22 8 28 18c-8-8-20-14-32-14S36 28 28 36z" fill="#44403C" opacity=".3"/>
  <!-- side hair strands -->
  <path d="M22 58c-6 16-4 32 2 42M98 58c6 16 4 32-2 42" stroke="#292524" stroke-width="8" stroke-linecap="round"/>
  <!-- brows -->
  <path d="M40 50c6-3 12-3 16 1" stroke="#44403C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M64 51c4-4 12-4 18 0" stroke="#44403C" stroke-width="2.8" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="46" cy="58" rx="5" ry="6" fill="#1C1917"/>
  <ellipse cx="74" cy="58" rx="5" ry="6" fill="#1C1917"/>
  <circle cx="47" cy="56" r="2" fill="#FFF"/>
  <circle cx="75" cy="56" r="2" fill="#FFF"/>
  <!-- lashes -->
  <path d="M40 54l4 2M52 62l-2 3M68 54l4 2M80 62l2 3" stroke="#292524" stroke-width="1.5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M58 64c2 3 4 3 6 0" stroke="#C4A07A" stroke-width="2" stroke-linecap="round"/>
  <!-- lips -->
  <path d="M50 72c5 4 15 4 20 0" fill="#E879A9" opacity=".75"/>
  <path d="M52 71c4 1 12 1 16 0" stroke="#BE185D" stroke-width="1" opacity=".4"/>
  <!-- blush -->
  <ellipse cx="38" cy="66" rx="6" ry="4" fill="#F472B6" opacity=".25"/>
  <ellipse cx="82" cy="66" rx="6" ry="4" fill="#F472B6" opacity=".25"/>
  <!-- earrings -->
  <circle cx="26" cy="62" r="3" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <circle cx="94" cy="62" r="3" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
</svg>
