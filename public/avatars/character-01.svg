<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c1-skin" x1="60" y1="32" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C99A"/><stop offset="1" stop-color="#E8A86B"/>
    </linearGradient>
    <linearGradient id="c1-hair" x1="40" y1="8" x2="88" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="c1-shirt" x1="30" y1="78" x2="90" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="c1-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#c1-bg)"/>
  <!-- shoulders / shirt -->
  <path d="M8 118c6-22 28-34 52-34s46 12 52 34H8z" fill="url(#c1-shirt)"/>
  <path d="M28 88h64v30H28z" fill="url(#c1-shirt)"/>
  <path d="M38 86h44v6c0 2-8 4-22 4s-22-2-22-4v-6z" fill="#FACC15"/>
  <rect x="34" y="94" width="18" height="14" rx="3" fill="#FACC15" opacity=".95"/>
  <circle cx="60" cy="100" r="2" fill="#0E7490"/><circle cx="66" cy="100" r="2" fill="#0E7490"/>
  <!-- neck -->
  <ellipse cx="60" cy="82" rx="14" ry="10" fill="#E8A86B"/>
  <!-- face -->
  <ellipse cx="60" cy="58" rx="36" ry="34" fill="url(#c1-skin)" filter="url(#c1-sh)"/>
  <!-- beard -->
  <path d="M28 58c2 22 16 34 32 36s30-14 32-36c-4 18-18 28-32 28S32 76 28 58z" fill="#1E293B"/>
  <path d="M36 52c0 8 10 14 24 14s24-6 24-14c-6 6-14 10-24 10S42 58 36 52z" fill="#374151"/>
  <!-- hair -->
  <path d="M24 52c2-28 18-42 36-42s34 14 36 42c-8-12-22-18-36-18S32 40 24 52z" fill="url(#c1-hair)"/>
  <path d="M26 44c6-10 18-16 34-16s28 6 34 16c-6-4-16-8-34-8S32 40 26 44z" fill="#374151" opacity=".35"/>
  <!-- brows -->
  <path d="M38 48c6-4 12-4 16 0" stroke="#1F2937" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M66 48c4-4 10-4 16 0" stroke="#1F2937" stroke-width="3.5" stroke-linecap="round"/>
  <!-- happy closed eyes -->
  <path d="M42 56c4 5 8 5 12 0" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 56c4 5 8 5 12 0" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="60" cy="64" rx="4" ry="3" fill="#D4956A" opacity=".55"/>
  <!-- smile peek -->
  <path d="M50 72c4 4 16 4 20 0" stroke="#92400E" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <!-- cheek blush -->
  <ellipse cx="38" cy="66" rx="6" ry="4" fill="#F87171" opacity=".22"/>
  <ellipse cx="82" cy="66" rx="6" ry="4" fill="#F87171" opacity=".22"/>
</svg>
