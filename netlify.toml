[build]
  command = "npm run build:netlify"
  publish = "dist"

# Keep Playwright browsers inside the project so Netlify can cache them across builds
# (avoids re-downloading ~260MB Chromium every deploy).
[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"
  # Do NOT set ENABLE_SLASH_301 here. Turned on 7 Nov 2026 and it took the
  # whole site down again: Netlify matches redirect `from` paths ignoring the
  # trailing slash, so `/x/ /x 301!` also fires on `/x` and loops, even with
  # Pretty URLs off. scripts/check-trailing-slash.mjs cannot detect this.

# Path redirects live in public/_redirects (copied to dist) so they cannot drift
# from prerender output. Keep host-level apex rule here.
# http first: without it, http://www took two hops (forced HTTPS to https://www.,
# then this rule to the apex). Naming the scheme collapses it to one 301.
[[redirects]]
  from = "http://www.topedgeai.com/*"
  to = "https://topedgeai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.topedgeai.com/*"
  to = "https://topedgeai.com/:splat"
  status = 301
  force = true

# Edge-cache every response (HTML included) on Netlify's CDN.
#
# LCP on mobile India was dominated by TTFB: HTML shipped
# `cache-control: public,max-age=0,must-revalidate` and the edge reported
# `fwd=miss`, so every visit revalidated against origin (0.65-1.5s TTFB).
#
# `Netlify-CDN-Cache-Control` is read by the CDN only and is stripped before the
# response reaches the browser, so the browser keeps revalidating (no stale HTML
# after a deploy) while the edge serves from cache. Netlify invalidates this
# cache automatically on every deploy, so a long s-maxage is safe.
#
# Deliberately only sets the CDN header here: the browser-facing Cache-Control
# for /assets/*, images and media stays owned by the specific rules below.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=604800, stale-while-revalidate=604800, durable"
    # Security headers (technical audit, 24 Nov 2026: live responses carried
    # HSTS only). These four cannot break a page: no inline-script policy is
    # set here. A full Content-Security-Policy is deliberately NOT added yet;
    # GA4, the Google Ads tag, the Meta pixel and PostHog all inject scripts,
    # so it has to ship as Report-Only first and be tuned from real reports.
    # frame-ancestors allows our own subdomains (the dashboard) and nobody else.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://*.topedgeai.com"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Long-cache hashed assets + static media (PSI: efficient cache lifetimes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Fonts and SVG marks had no rule and were revalidated on every visit
# (technical audit, 24 Nov 2026). The two font files only change with a rename.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Plain-text and XML crawl surfaces. These had no explicit rule, so they
# inherited the default and a crawler could be handed a stale copy after a
# deploy while the HTML it describes was already new. One hour, same for every
# user agent: there is no UA branching anywhere in this repo and these three
# files are the ones AI answer engines fetch directly.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
